server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://aria-backend-629352210643.us-central1.run.app/;
        proxy_set_header Host aria-backend-629352210643.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
