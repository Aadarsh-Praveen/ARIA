<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARIA — Adaptive Role-based Intelligence Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%236366f1'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-weight='bold'>A</text></svg>">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', sans-serif; background: #050B18; color: #dce2f5; overflow: hidden; height: 100vh; }
      #root { height: 100vh; }
      .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 20px; display: inline-block; line-height: 1; text-transform: none; letter-spacing: normal; word-wrap: normal; white-space: nowrap; direction: ltr; }
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(70,69,84,0.4); border-radius: 2px; }
      input::placeholder { color: rgba(199,196,215,0.3); }
      strong { color: #e8e8ff; font-weight: 700; }
      em { color: #c0c1ff; font-style: italic; }
      @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes pulseGreen { 0% { box-shadow: 0 0 0 0 rgba(78,222,163,0.5); } 70% { box-shadow: 0 0 0 8px rgba(78,222,163,0); } 100% { box-shadow: 0 0 0 0 rgba(78,222,163,0); } }
      @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(255,180,171,0.5); } 70% { box-shadow: 0 0 0 8px rgba(255,180,171,0); } 100% { box-shadow: 0 0 0 0 rgba(255,180,171,0); } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
